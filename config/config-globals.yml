# Alle disse verdiene blir lest inn som options i hver pakke (khfunctions.profileyear, qualcontrol.profileyear osv)
# Andre fellesoptions som ikke skal variere ligger i config-arkitektur og brukes som "kh.optname"
# profileyear - styrer hvilke mapper friskvikfiler og kvalitetskontrolloutput havner
# geoyear - styrer hvilket geoår som er aktivt
# publication.folder - mappenavn hvor ferdige filer til statistikkbanken legges (i kh.paths$kube$statbank$root)
profileyear: 2027
geoyear: 2026
publication.dir: "STATBANK_2027"

# databaser
db_khelsa: "STYRING/KHELSA_backend/KHELSA_BE.accdb"
db_geo: "STYRING/raw-khelse/geo-koder.accdb"

