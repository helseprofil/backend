# Felles-options som skal brukes på tvers i alle pakker og ikke trenger å dupliseres
# Leses bare inn som khtools.navn

# duckdb-config, for å sette ulike grenser på ulike maskiner
duckdbopts:
  default:
    mem_limit_gb: 8
    path: null
  POSL-SDIR-FHP02:
    mem_limit_gb: 100
    path: "D:/khtools_db"
  POSL-SDIR-FHP03:
    mem_limit_gb: 8
    path: "D:/khtools_db"
  POSL-SDIR-FHP04:
    mem_limit_gb: 24
    path: "D:/khtools_db"
  POSL-SDIR-FHP05:
    mem_limit_gb: 24
    path: "D:/khtools_db"

# Kolonnelister
prikkeinfo: [pvern, orgprikket, serieprikket, naboprikket, dekningprikket, geoprikket, manuellprikket]

val.standard: [TELLER, sumTELLER, NEVNER, sumNEVNER, MEIS, RATE, SMR]

dim.standard: [GEO, AAR, KJONN, ALDER, UTDANN, INNVKAT, LANDBAK, TAB1, TAB2, TAB3]
dim.interval: [AARl, AARh, ALDERl, ALDERh]
## dim.tab settes dynamisk ved lasting av khtools og leser alle unike verdier av TAB1-3

friskvik.tabs: [GEO , AAR, KJONN, ALDER, UTDANN, INNVKAT, LANDBAK, ETAB]
friskvik.vals: [sumTELLER, sumNEVNER, RATE, MALTALL, sumPREDTELLER, PREDTELLER, SMR, NORM, MEIS, RATE.n]

# Demping av konsolloutput med msg() og header()
silent: FALSE
